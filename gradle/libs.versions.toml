[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
exposed = "1.6.1"
coroutines = "1.11.0"
swagger-ui = "5.34.1"
hikari = "7.1.0"
sqlite = "3.54.1.0"
postgresql = "42.7.14"
bcrypt = "0.10.2"
# LegadoTeam 定制的 JS 引擎，随仓库附带在 third_party/maven
htmlunit-core-js = "5.3.0-legado.4"
okhttp = "5.5.1"
jsoup = "1.24.1"
jsoupxpath = "2.5.5"
json-path = "3.0.0"
gson = "2.15.0"
hutool = "5.8.48"
commons-text = "1.15.0"
brotli = "0.1.2"
quick-transfer = "0.2.17"
logback = "1.6.6"

[libraries]
# Ktor
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-gson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
# 开放接口文档（Swagger UI 静态资源，离线可用）
swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swagger-ui" }

# 数据库
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

# 书源引擎（移植自阅读）
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
htmlunit-core-js = { module = "org.htmlunit:htmlunit-core-js", version.ref = "htmlunit-core-js" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jsoupxpath = { module = "cn.wanghaomiao:JsoupXpath", version.ref = "jsoupxpath" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "json-path" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
hutool-crypto = { module = "cn.hutool:hutool-crypto", version.ref = "hutool" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli" }
quick-transfer-core = { module = "com.github.liuyueyi.quick-chinese-transfer:quick-transfer-core", version.ref = "quick-transfer" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
ktor-server = [
    "ktor-server-core", "ktor-server-netty", "ktor-server-content-negotiation", "ktor-serialization-gson",
    "ktor-server-auth", "ktor-server-auth-jwt", "ktor-server-status-pages", "ktor-server-call-logging",
    "ktor-server-cors", "ktor-server-compression", "ktor-server-sse", "ktor-server-websockets",
    "ktor-server-config-yaml",
]
database = ["exposed-core", "exposed-jdbc", "hikari", "sqlite-jdbc", "postgresql"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
