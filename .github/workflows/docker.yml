# 构建 Docker 镜像并发布到 GitHub Container Registry（ghcr.io/<owner>/<repo>）
# 和 Docker Hub（<用户名>/legado-web，需要在仓库 Settings → Secrets and variables → Actions 中
# 添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN（Docker Hub 的访问令牌，权限 Read & Write）；没有添加时只发布到 ghcr.io）
# - 推送到默认分支（或在 Actions 页面手动运行）：发布 latest 和构建时间标签（北京时间，如 20261024-1530）
# - 推送 v* 标签（如 v1.2.3）：发布 1.2.3 和构建时间标签（不更新 latest）
# - Pull Request、其他分支：只构建检查，不发布
name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # if 条件里不能直接读取 secrets，先放到环境变量里。用户名放在 Variables 或 Secrets 都可以
  # （放在 Secrets 里时，日志中的镜像名会显示为 ***）
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 镜像名必须小写
      - name: Image name
        id: name
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then echo "dockerhub=${DOCKERHUB_USERNAME,,}/legado-web" >> "$GITHUB_OUTPUT"; fi
          # 构建时间（秒）：作为 SOURCE_DATE_EPOCH 传给 Docker，镜像的 created 就是这个时间；
          # 同时写进镜像的环境变量，服务据此与仓库里 latest 的 created 比较，检查更新
          t=$(date +%s)
          echo "time=$t" >> "$GITHUB_OUTPUT"
          # 版本标签：构建时间（北京时间），如 20261024-1530
          echo "version=$(TZ=Asia/Shanghai date -d "@$t" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 没有配置 Docker Hub 时第二行为空，会被忽略
          images: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.dockerhub }}
          # latest（默认分支）、构建时间（如 20261024-1530，可以用来固定或回退到某个版本）、版本号（v* 标签）
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.name.outputs.version }},enable=${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
          # latest 只由上面那行控制（否则推送 v* 标签时也会自动加上 latest）
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.name.outputs.time }}
            LEGADO_IMAGE=${{ steps.name.outputs.image }}
          push: ${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
