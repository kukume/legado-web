# 使用 GitHub Actions 构建好的镜像（GitHub Container Registry，支持 amd64 / arm64），不需要在本机构建：
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 更新到最新版本：
#
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
#
# 镜像名默认是 ghcr.io/kukume/legado-web，仓库名或用户名不同时用环境变量 LEGADO_IMAGE 指定，
# 例如在同目录的 .env 文件里写：LEGADO_IMAGE=ghcr.io/<用户名>/<仓库名>:latest
services:
  legado-web:
    image: ${LEGADO_IMAGE:-ghcr.io/kukume/legado-web:latest}
    ports:
      - "8955:8080"
    volumes:
      - ./data:/data
    environment:
      # 默认使用 SQLite（数据在 ./data/legado.db）。改用 PostgreSQL 时取消下面的注释
      # LEGADO_DB_TYPE: postgres
      # LEGADO_DB_URL: jdbc:postgresql://postgres:5432/legado
      # LEGADO_DB_USER: legado
      # LEGADO_DB_PASSWORD: legado
      TZ: Asia/Shanghai
      # 服务以普通用户运行（不是 root），启动时会把 ./data 里的文件改成这个用户。
      # 设成宿主机上自己账号的 uid / gid（执行 id 查看），./data 里的文件就属于你自己，默认 1000
      PUID: 1000
      PGID: 1000
    restart: unless-stopped
    # depends_on: [postgres]
    networks:
      - legado-network

  # 浏览器（可选，默认不启动）：只有用到 webView:true 的书源，或在“系统设置”中开启了“使用远程浏览器”时才需要。
  # 下面两个浏览器选一个取消注释，启动后在后台“系统设置”的“浏览器调试地址”中填写 http://browser:9222。
  # 每次打开网页都在新的浏览器上下文（相当于无痕窗口）中进行，用完销毁，不会在浏览器里留下数据。
  # 调试端口没有密码，不要映射到公网。
  #
  # 1. Chromium 无界面浏览器（chromedp/headless-shell）：免费，不需要任何配置，一般用这个
  # browser:
  #   image: chromedp/headless-shell:latest
  #   container_name: browser
  #   # Chromium 用 /dev/shm 存放页面数据，Docker 默认只有 64MB，打开较大的网页时可能崩溃
  #   shm_size: 512m
  #   restart: unless-stopped
  #   networks:
  #     - legado-network
  #
  # 2. CloakBrowser：做了反检测，书源网站有 Cloudflare 等人机验证、上面的浏览器过不去时换成这个。
  #    需要先到 https://cloakbrowser.dev 申请免费的 key，按它的文档加到下面的 environment 里
  # browser:
  #   image: cloakhq/cloakbrowser
  #   container_name: browser
  #   command: cloakserve
  #   # environment:
  #   restart: unless-stopped
  #   networks:
  #     - legado-network


  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_DB: legado
  #     POSTGRES_USER: legado
  #     POSTGRES_PASSWORD: legado
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #    - legado-network

networks:
  legado-network:
    driver: bridge